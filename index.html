<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <!-- Ottimizzazione viewport senza restrizioni di zoom -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centro Sportivo Michelangelo | L'Energia prende Forma</title>
    <meta name="description" content="Allenamento, competizione e relax nel cuore di Firenze. Scopri i nostri campi da Padel, Calcio, Piscina Olimpionica e Palestra.">
    
    <!-- Fogli di stile -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Media Queries per responsività strutturale esplicita -->
    <style>
        @media (max-width: 768px) {
            .sports-grid {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 15px;
            }
            #main-title {
                font-size: 2.2rem;
            }
            .bottom-dock {
                padding: 10px;
            }
        }
        @media (max-width: 480px) {
            .sports-grid {
                grid-template-columns: 1fr;
            }
            #main-title {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <!-- 1. SFONDO E OVERLAY (Immagine hero-sport.jpg nitida e visibile da CSS) -->
    <div class="background-container">
        <div class="glass-overlay"></div>
    </div>

    <!-- 2. HEADER MINIMAL (Glassmorphism) -->
    <header class="top-nav glass-panel">
        <div class="brand-container">
            <h1 class="brand-logo">MICHELANGELO <span class="brand-accent">SPORT</span></h1>
        </div>
    </header>

    <!-- 3. SCHERMATA PRINCIPALE (Centrale) -->
    <main class="hero-center">
        <div class="hero-titles">
            <h2 id="main-title">Sblocca il tuo potenziale</h2>
            <p id="main-subtitle">Allenamento, competizione e relax nel cuore di Firenze.</p>
        </div>

        <!-- 4. GRIGLIA DEGLI SPORT (Touch-friendly per App) -->
        <div class="sports-grid">
            <a href="#palestra" class="sport-node">
                <div class="node-icon">💪</div>
                <div class="node-text">
                    <h3>PALESTRA</h3>
                    <span>Area Fitness & Pesi</span>
                </div>
            </a>
            
            <a href="#padel" class="sport-node">
                <div class="node-icon">🎾</div>
                <div class="node-text">
                    <h3>PADEL</h3>
                    <span>Prenota Campo</span>
                </div>
            </a>

            <a href="#piscina" class="sport-node">
                <div class="node-icon">🏊‍♂️</div>
                <div class="node-text">
                    <h3>PISCINA</h3>
                    <span>Nuoto & Relax</span>
                </div>
            </a>

            <a href="#calcio" class="sport-node">
                <div class="node-icon">⚽</div>
                <div class="node-text">
                    <h3>CALCIO</h3>
                    <span>Campi a 5, 8 e 11</span>
                </div>
            </a>
        </div>
    </main>

    <!-- Ancoraggi Nativi Nascosti (Progressive Enhancement - Fallback no-JS) -->
    <div style="height: 0; width: 0; overflow: hidden; position: absolute;" aria-hidden="true">
        <div id="palestra"></div>
        <div id="padel"></div>
        <div id="piscina"></div>
        <div id="calcio"></div>
        <div id="chi-siamo"></div>
        <div id="orari-mappa"></div>
    </div>

    <!-- 5. DOCK INFERIORE (Aggiornata: Chi Siamo al posto del tasto Home ridondante) -->
    <nav class="bottom-dock glass-dock">
        <!-- Nuova scheda Chi Siamo -->
        <a href="#chi-siamo" class="dock-btn" title="Chi Siamo">
            <span class="dock-icon">👥</span>
            <span class="dock-label">Chi Siamo</span>
        </a>
        
        <!-- Scheda Contatti, Mappa e Orari -->
        <a href="#orari-mappa" class="dock-btn" title="Mappa e Orari">
            <span class="dock-icon">📍</span>
            <span class="dock-label">Info</span>
        </a>
        
        <!-- Chiamata diretta -->
        <a href="tel:+390551234567" class="dock-btn call-action" title="Chiama Ora">
            <span class="dock-icon">📞</span>
            <span class="dock-label">Chiama</span>
        </a>
    </nav>

    <!-- 6. CONTENITORE MODALI (Finestre a comparsa istantanee) -->
    <div id="modal-overlay" class="hidden">
        <div id="modal-content-box" class="glass-modal">
            <div id="modal-dynamic-body"></div>
        </div>
    </div>

    <!-- SCRIPT (Motore Logico) -->
    <script src="js/modals.js" defer></script>
</body>
</html>
